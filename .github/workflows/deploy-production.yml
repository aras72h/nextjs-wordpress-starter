name: Deploy to Production

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v1.2.3, etc.

jobs:
  build-and-push:
    name: Build & Push Next.js Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify tag is on main branch
        run: |
          # Check if the tag points to a commit that exists on main
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "❌ ERROR: Tag ${{ github.ref_name }} is not on main branch"
            echo "Production deploys must be tagged from main branch only"
            exit 1
          fi
          echo "✅ Tag is on main branch"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push Next.js
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/nextjs-wordpress-starter/web:latest
            ${{ secrets.REGISTRY_HOST }}/nextjs-wordpress-starter/web:${{ steps.version.outputs.VERSION }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.PROD_SITE_URL }}
            WORDPRESS_API_URL=${{ secrets.PROD_WORDPRESS_API_URL }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_HOST }}/nextjs-wordpress-starter/web:buildcache-prod
          cache-to: type=registry,ref=${{ secrets.REGISTRY_HOST }}/nextjs-wordpress-starter/web:buildcache-prod,mode=max

  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Copy deployment script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'scripts/deploy-production.sh'
          target: '/tmp/'
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY_USER,REGISTRY_PASSWORD,VERSION
          script: |
            chmod +x /tmp/deploy-production.sh
            /tmp/deploy-production.sh
            rm /tmp/deploy-production.sh
